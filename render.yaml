# Render Blueprint: TrustShield API STAGING (same image and settings as production). Nothing here creates a charge until the
# blueprint is applied in the Render dashboard, where the plan and price are shown for confirmation.
services:
  - type: web
    name: trustshield-api-staging
    runtime: docker
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    plan: standard            # Render plan id 1c-2g: 1 CPU / 2 GB RAM, $25/month list price (per render.com/pricing, 2026-09-26)
    numInstances: 1           # stateless single instance: in-memory rate limits and sandbox polling assume one instance
    region: oregon
    autoDeployTrigger: checksPass   # deploy only after the GitHub CI gate passes
    healthCheckPath: /healthz
    dockerCommand: ""         # use the image CMD (uvicorn, one worker)
    envVars:
      - key: TRUSTSHIELD_ENV
        value: staging
      - key: PORT
        value: "8000"
      - key: MODEL_RELEASE                # build arg (plain): private release holding the exact promoted artifacts
        value: shubhsaxena2020/trustshield-ai@model-v3
      - key: MODEL_FETCH_TOKEN            # SECRET: fine-grained PAT, this repo only, Contents: read-only. Used as a BuildKit build secret.
        sync: false
      - key: CORS_ALLOWED_ORIGINS         # exact deployed frontend origin(s), https only
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
      - key: ENABLE_WEB_SANDBOX
        value: "false"
      - key: TRUSTSHIELD_SANDBOX_ALLOW_EXTERNAL
        value: "false"
      - key: ENABLE_EXTERNAL_REPUTATION
        value: "false"
      - key: TRUSTSHIELD_RESULT_STORE
        value: sandbox_only
      - key: TRUSTSHIELD_TRUSTED_PROXY_HOPS   # set from the OBSERVED X-Forwarded-For chain (scripts/observe_proxy_chain.py), not guessed
        value: "0"
